worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/stderr error;

    upstream fraud_api {
        server app1:9999;
        server app2:9999;
        # Reuse upstream connections instead of a fresh TCP handshake per request
        # (visible tax at the 1-10ms latency target the scoring rewards).
        keepalive 128;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://fraud_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # If one instance is still loading its index (not yet ready), retry
            # the other rather than surfacing an error (HTTP errors are the
            # worst-weighted failure in scoring).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 1s;
        }
    }
}
