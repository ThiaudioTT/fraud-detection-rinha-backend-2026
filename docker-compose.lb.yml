services:
  app1:
    image: fraud-detection:local
    build:
      context: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fraud?sslmode=disable
    depends_on:
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  app2:
    image: fraud-detection:local
    build:
      context: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fraud?sslmode=disable
    depends_on:
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  db:
    image: pgvector/pgvector:pg17
    shm_size: 5gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - ./cmd/seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    image: fraud-detection:local
    build:
      context: .
    command: ["./seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fraud?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: