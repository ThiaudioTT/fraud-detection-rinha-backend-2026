services:
  app:
    container_name: fraud_detection
    image: fraud-detection:local
    build:
      context: .
    ports:
      - "9999:9999"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fraud?sslmode=disable
    depends_on:
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    container_name: fraud_db
    image: pgvector/pgvector:pg17
    shm_size: 5gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - ./cmd/seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    container_name: fraud_seed
    image: fraud-detection:local
    build:
      context: .
    command: ["./seed"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fraud?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
