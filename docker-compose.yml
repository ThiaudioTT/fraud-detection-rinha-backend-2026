services:
  app1: &app
    image: ghcr.io/thiaudiott/fraud-detection-rinha-backend-2026:main
    pull_policy: always
    environment:
      REFERENCES_PATH: /app/references.bin
      GOMEMLIMIT: 140MiB
      GOGC: "off"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    cpuset: "1"
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 158M

  app2:
    <<: *app
    cpuset: "2"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "0"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 32M
